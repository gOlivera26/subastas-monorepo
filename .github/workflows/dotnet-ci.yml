name: .NET 8 CI - Subastas Monorepo

on:
  push:
    branches: [ "master", "main", "Development", "development" ]
  pull_request:
    branches: [ "master", "main", "Development", "development" ]

jobs:
  build-test-security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: |
        dotnet restore PortalSubastas.Gateway/PortalSubastas.Gateway/PortalSubastas.Gateway.csproj
        dotnet restore PortalSubastas.Identity/PortalSubastas.Identity.slnx
        dotnet restore PortalSubastas.Licitaciones/PortalSubastas.Licitaciones.API/PortalSubastas.Licitaciones.API.csproj
        dotnet restore PortalSubastas.Providers/PortalSubastas.Providers.API/PortalSubastas.Providers.API.csproj
        dotnet restore PortalSubastas.Reporting/PortalSubastas.Reporting.API/PortalSubastas.Reporting.API.csproj
        dotnet restore PortalSubastas.Audit/PortalSubastas.Audit.slnx

    - name: Build services
      run: |
        dotnet build PortalSubastas.Gateway/PortalSubastas.Gateway/PortalSubastas.Gateway.csproj --configuration Release --no-restore
        dotnet build PortalSubastas.Identity/PortalSubastas.Identity.slnx --configuration Release --no-restore
        dotnet build PortalSubastas.Licitaciones/PortalSubastas.Licitaciones.API/PortalSubastas.Licitaciones.API.csproj --configuration Release --no-restore
        dotnet build PortalSubastas.Providers/PortalSubastas.Providers.API/PortalSubastas.Providers.API.csproj --configuration Release --no-restore
        dotnet build PortalSubastas.Reporting/PortalSubastas.Reporting.API/PortalSubastas.Reporting.API.csproj --configuration Release --no-restore
        dotnet build PortalSubastas.Audit/PortalSubastas.Audit.slnx --configuration Release --no-restore

    - name: Test Identity with coverage
      run: dotnet test PortalSubastas.Identity/PortalSubastas.Identity.slnx --configuration Release --no-build --collect:"XPlat Code Coverage" --logger "console;verbosity=normal"

    - name: Dependency vulnerability audit
      continue-on-error: true
      run: |
        dotnet list PortalSubastas.Gateway/PortalSubastas.Gateway/PortalSubastas.Gateway.csproj package --vulnerable --include-transitive
        dotnet list PortalSubastas.Identity/PortalSubastas.Identity.slnx package --vulnerable --include-transitive
        dotnet list PortalSubastas.Licitaciones/PortalSubastas.Licitaciones.API/PortalSubastas.Licitaciones.API.csproj package --vulnerable --include-transitive
        dotnet list PortalSubastas.Providers/PortalSubastas.Providers.API/PortalSubastas.Providers.API.csproj package --vulnerable --include-transitive
        dotnet list PortalSubastas.Reporting/PortalSubastas.Reporting.API/PortalSubastas.Reporting.API.csproj package --vulnerable --include-transitive
        dotnet list PortalSubastas.Audit/PortalSubastas.Audit.slnx package --vulnerable --include-transitive

    - name: Secret scanning (Gitleaks)
      uses: gitleaks/gitleaks-action@v2
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Trivy filesystem scan
      uses: aquasecurity/trivy-action@0.28.0
      continue-on-error: true
      with:
        scan-type: fs
        scan-ref: .
        format: table
        exit-code: 1
        severity: CRITICAL,HIGH

    - name: OWASP ZAP baseline
      if: ${{ vars.ZAP_TARGET_URL != '' }}
      uses: zaproxy/action-baseline@v0.14.0
      continue-on-error: true
      with:
        target: ${{ vars.ZAP_TARGET_URL }}
